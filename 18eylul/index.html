<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#171717">
<meta name="description" content="18-19-20 Eylül Online Ürün Fotoğrafçılığı Atölyesi videoları.">
<title>18-19-20 Eylül Online Ürün Fotoğrafçılığı Atölyesi | Savaş Çıkrak</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100svh;
  background:#171717;
  color:#f4f0ea;
  font-family:'Helvetica Neue',Arial,sans-serif
}

.page{
  width:min(100% - 48px,1080px);
  margin:0 auto;
  padding:clamp(48px,8vw,96px) 0 80px
}

h1{
  max-width:920px;
  margin:0 0 clamp(28px,5vw,52px);
  font-size:clamp(2rem,4.4vw,4.2rem);
  font-weight:400;
  line-height:1.1;
  letter-spacing:-.035em
}

.video-title{
  margin:0 0 16px;
  font-size:clamp(1.15rem,2vw,1.5rem);
  font-weight:500;
  line-height:1.2;
  letter-spacing:.01em
}

.video-panel{
  width:100%
}

.video-panel p{
  margin:0;
  color:#c8c1b8;
  font-size:1.05rem
}

mux-player{
  display:block;
  width:100%;
  aspect-ratio:16/9
}

@media(max-width:760px){
  .page{
    width:min(100% - 32px,1080px);
    padding:40px 0 56px
  }

  h1{
    font-size:clamp(1.8rem,8vw,3rem);
    margin-bottom:28px
  }

  .video-title{
    margin-bottom:12px
  }
}
</style>

<script src="https://cdn.jsdelivr.net/npm/@mux/mux-player" defer></script>
</head>

<body>

<main class="page">

  <h1>18-19-20 EYLÜL ONLINE ÜRÜN FOTOĞRAFÇILIĞI ATÖLYESİ</h1>

  <h2 class="video-title">1. GÜN — BÖLÜM 1</h2>

  <section class="video-panel" id="video-panel" aria-label="Atölye videosu">
    <p>Video yükleniyor…</p>
  </section>

</main>

<script>
async function loadVideo() {
  try {
    const response = await fetch('/api/playback-token', {
      credentials: 'same-origin',
      cache: 'no-store'
    });

    if (!response.ok) throw new Error('Playback unavailable');

    const { playbackId, token } = await response.json();

    if (!playbackId || !token) throw new Error('Playback unavailable');

    await customElements.whenDefined('mux-player');

    const player = document.createElement('mux-player');

    player.setAttribute('playback-id', playbackId);
    player.setAttribute('playback-token', token);
    player.setAttribute('metadata-video-title', '1. GÜN Bölüm 1');

    document.getElementById('video-panel').replaceChildren(player);

  } catch {
    document.getElementById('video-panel').replaceChildren(
      Object.assign(document.createElement('p'), {
        textContent: 'Video şu anda açılamıyor.'
      })
    );
  }
}

loadVideo();
</script>

</body>
</html>
